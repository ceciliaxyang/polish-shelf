<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Polish Shelf</title>
  <meta name="description" content="A nail polish collection, swatched: browse by effect and layer polishes to see how they combine.">
  <!-- Link previews (iMessage, Slack, social apps). Image: Figma "imessage preview", node 2196:92228 (a rotating polish bottle). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Polish shelf">
  <meta property="og:title" content="Polish shelf">
  <meta property="og:description" content="A nail polish collection, swatched: browse by effect and layer polishes to see how they combine.">
  <meta property="og:url" content="https://ceciliayang.com/polish-shelf/">
  <meta property="og:image" content="https://ceciliayang.com/polish-shelf/images/og-7.gif">
  <meta property="og:image:type" content="image/gif">
  <meta property="og:image:width" content="960">
  <meta property="og:image:height" content="504">
  <meta property="og:image:alt" content="An animated nail polish bottle slowly rotating, its green and gold magnetic polish shimmering">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://ceciliayang.com/polish-shelf/images/og-7.gif">
  <!-- Tab icon: a drop of Pandora's Box (Mooncat), drawn by the site's own swatch and droplet code. The small
       sizes carry a faint magenta rim so the drop's dark edge still reads on a dark tab bar. -->
  <link rel="icon" type="image/png" sizes="16x16" href="images/icon/favicon-16.png?v=1">
  <link rel="icon" type="image/png" sizes="32x32" href="images/icon/favicon-32.png?v=1">
  <link rel="icon" type="image/png" sizes="48x48" href="images/icon/favicon-48.png?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="images/icon/apple-touch-icon.png?v=1">
  <!-- The title and the filter labels are set in Instrument Serif (Figma node 2384:82780), served from
       fonts/ (see the @font-face rules at the top of css/style.css). -->
  <link rel="preload" href="fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- ?v= changes with each release so browsers never pair new HTML with an old cached stylesheet or script. -->
  <link rel="stylesheet" href="css/style.css?v=77">
  <!-- Is SF Pro (installed, or the Apple system font) available? If not, the page falls back to Inter and
       html gets "no-sf", which tightens Inter's letter spacing (see css/style.css). Checked by comparing
       text widths against a font that doesn't exist. -->
  <script>
    (function () {
      try {
        var c = document.createElement("canvas").getContext("2d"), s = "Magnetic topper Glow-in-the-dark 0123";
        // A made-up family shows what the browser substitutes for a font it doesn't have (monospace, or on
        // Linux whatever font it matches instead); SF measuring the same means it isn't there either.
        c.font = '40px "No Such Font 7f3a", monospace'; var none = c.measureText(s).width;
        // Some Linux setups quietly map "SF Pro Display" to an installed Inter, so match against that too.
        c.font = '40px "Inter", "No Such Font 7f3a", monospace'; var inter = c.measureText(s).width;
        c.font = '40px "SF Pro Display", -apple-system, BlinkMacSystemFont, "No Such Font 7f3a", monospace'; var sf = c.measureText(s).width;
        if (Math.abs(sf - none) < 0.5 || Math.abs(sf - inter) < 0.5) document.documentElement.classList.add("no-sf");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="page">
    <div class="layout closed" id="layout">
      <main>
        <header class="shelf-head">
          <!-- Title row (Figma node 2383:2324). Favorite combos is a floating button beside the zoom bar (below). -->
          <div class="shelf-top">
            <h1 class="shelf-title" id="shelfTitle">Polish shelf</h1>
          </div>
        </header>
        <!-- Filters (Figma node 2384:82776): a labeled row each for effects and brands, pills on the right,
             with a hairline under each row. Once they scroll out of view, the mini nav below shows the same pills in one row. -->
        <div class="filters" id="filters">
          <div class="filter-rows" id="filterRows">
          <div class="filter-row">
            <h2 class="filter-label" id="fxLabel">Effects</h2>
            <div class="scopes fx-row" id="fxPills" role="group" aria-labelledby="fxLabel"></div>
          </div>
          <div class="filter-row">
            <h2 class="filter-label" id="brandLabel">Brands</h2>
            <div class="scopes fx-row" id="brandPills" role="group" aria-labelledby="brandLabel"></div>
          </div>
          </div>
        </div>
        <div class="grid" id="grid"></div>
      </main>

    </div>
    <!-- Closes Favorite combos (pinned top right, like the polish page's close); only shown on that page. -->
    <button type="button" class="mh-btn combos-close" id="combosClose" aria-label="Close favorite combos" title="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
  </div>
  <!-- Mini nav: one row of the filter pills that slides in at the top once the filters scroll away (app.js). -->
  <nav class="mini-nav" id="miniNav" aria-label="Filters" inert><div class="mini-row fx-row" id="miniRow"></div></nav>
  <!-- Bottom dock: the zoom bar (three icons: 2, 3 or 4 swatches per row on a phone), centered, with the
       Favorite combos button floating just to its right once a combo is saved. -->
  <div class="dock" id="dock">
    <div class="zoom" id="zoom" role="radiogroup" aria-label="Swatch size"></div>
    <button type="button" class="combo-fab" id="comboBtn" aria-pressed="false" aria-controls="grid" title="Favorite combos" hidden><span class="thumb-pair" id="comboThumbs" aria-hidden="true"><span class="tp tp-back"></span><span class="tp tp-front"></span></span><span class="combo-fab-label">Combos</span><span class="combo-count" id="comboCount"></span></button>
  </div>
  <!-- The Layers pane lives outside the page so it stays sharp and on top, even over the detail dialog. -->
  <aside class="bench" id="bench" aria-label="Layers" hidden>
    <div class="bench-head" id="benchHead">
      <span class="sheet-handle" aria-hidden="true"></span>
      <div class="peek" id="peek">
        <div class="peek-mini" id="peekMini"></div>
        <div class="bench-titles">
          <h2 class="bench-title">Layers</h2>
          <span class="peek-count" id="peekCount"></span>
          <p class="peek-sub" id="peekSub"></p>
        </div>
        <div class="peek-thumbs" id="peekThumbs" aria-hidden="true"></div>
      </div>
      <button type="button" class="bench-clear" id="closeBench">Clear</button>
    </div>
    <div class="stage" id="stage"></div>
    <ol class="layers" id="layers" aria-label="Layers, top first"></ol>
    <button type="button" class="save-combo" id="saveCombo" hidden>Save combo</button>
  </aside>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mName" tabindex="-1" hidden>
    <div class="modal-blur"></div>
    <header class="modal-head">
      <div class="mh-trail">
        <button type="button" class="mh-btn m-add" id="mAdd" aria-label="Add to layers" title="Add to layers"></button>
        <a class="mh-btn" id="mLink" target="_blank" rel="noopener" aria-label="Open product page"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 9.5a3 3 0 0 0 4.24 0l2.5-2.5a3 3 0 0 0-4.24-4.24l-.9.9M9.5 6.5a3 3 0 0 0-4.24 0l-2.5 2.5a3 3 0 0 0 4.24 4.24l.9-.9"/></svg></a>
        <button type="button" class="mh-btn" id="mClose" aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
      </div>
    </header>
    <div class="modal-body">
      <div class="m-swatch" id="mStage"></div>
      <div class="mh-content">
        <h2 class="mh-name" id="mName"></h2>
        <p class="mh-desc" id="mDesc" hidden></p>
        <div class="mh-pills" id="mPills"></div>
      </div>
      <div class="m-photos" id="mPhotos"></div>
    </div>
  </div>

  <script src="js/polishes.js?v=77"></script>
  <script src="js/droplet.js?v=77"></script>
  <script src="js/icons.js?v=77"></script>
  <script src="js/brand-icons.js?v=77"></script>
  <script src="js/swatch-render.js?v=77"></script>
  <script src="js/app.js?v=77"></script>
</body>
</html>
