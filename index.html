<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Polish Shelf</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <div class="layout closed" id="layout">
      <main>
        <header class="shelf-head">
          <div class="shelf-top">
            <h1 class="shelf-title">Polish shelf</h1>
            <button type="button" class="layers-btn" role="switch" aria-checked="false" id="layeringToggle" aria-label="Layering" title="Layering"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.75 14.25 5 8 8.25 1.75 5 8 1.75Z"/><path d="M1.75 8 8 11.25 14.25 8" stroke-linecap="round"/><path d="M1.75 11 8 14.25 14.25 11" stroke-linecap="round"/></svg><span class="layers-state">Off</span></button>
          </div>
          <div class="scopes" id="fxPills" role="group" aria-label="Filter by effect"></div>
        </header>
        <div class="grid" id="grid"></div>
      </main>

      <aside class="bench" id="bench" aria-label="Layering bench" hidden>
        <div class="bench-head">
          <div>
            <h2>Layering bench</h2>
            <p class="hint">Stack polishes to preview a combination.</p>
          </div>
          <button type="button" class="pill" id="closeBench">Close</button>
        </div>
        <div class="stage"><canvas id="bigNail"></canvas></div>
        <div>
          <span class="label">Applied in this order</span>
          <ol class="layers" id="layers"></ol>
        </div>
        <div class="save-row">
          <input id="comboName" type="text" placeholder="Name this combo" aria-label="Combo name">
          <button class="pill" id="saveCombo" type="button">Save</button>
        </div>
        <div>
          <span class="label">Saved combos</span>
          <div class="combos" id="combos"></div>
        </div>
      </aside>
    </div>
  </div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mName" tabindex="-1" hidden>
    <div class="modal-blur"></div>
    <header class="modal-head">
      <div class="mh-content">
        <div class="mh-title"><p class="mh-brand" id="mBrand"></p></div>
        <p class="mh-name" id="mName"></p>
      </div>
      <div class="mh-trail">
        <a class="mh-btn" id="mLink" target="_blank" rel="noopener" aria-label="Open product page"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 9.5a3 3 0 0 0 4.24 0l2.5-2.5a3 3 0 0 0-4.24-4.24l-.9.9M9.5 6.5a3 3 0 0 0-4.24 0l-2.5 2.5a3 3 0 0 0 4.24 4.24l.9-.9"/></svg></a>
        <button type="button" class="mh-btn" id="mClose" aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
      </div>
    </header>
    <div class="m-swatch" id="mStage"></div>
    <div class="modal-body">
      <div class="m-photos" id="mPhotos"></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="js/polishes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
